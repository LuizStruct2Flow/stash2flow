# The project's own CI for backend/: the same four commands the local
# pre-push gate runs (.githooks/pre-push), plus a PostgreSQL service.
# security.yml is the framework's file and runs nothing for backend/.

name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend (build, lint, format, tests + coverage)
    runs-on: ubuntu-latest
    env:
      # Throwaway values for an empty database that lives for this job only.
      # Not a secret: nothing here ever holds real data.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: stash2flow
      PGPASSWORD: ci-throwaway-empty-db
      PGDATABASE: stash2flow
    services:
      db:
        # Same image as infra/docker-compose.yml.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: stash2flow
          POSTGRES_PASSWORD: ci-throwaway-empty-db
          POSTGRES_DB: stash2flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stash2flow -d stash2flow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # A service container cannot mount infra/initdb/, so the same three
      # statements run here as steps.
      - name: Create the extensions
        working-directory: infra/initdb
        run: psql -v ON_ERROR_STOP=1 -f 01-extensions.sql
      - name: Check the extensions are present
        run: |
          n=$(psql -tA -c "select count(*) from pg_extension where extname in ('vector','unaccent','pg_trgm')")
          echo "extensions present: $n of 3"
          test "$n" = 3
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Tests and coverage
        run: npm run test:coverage
